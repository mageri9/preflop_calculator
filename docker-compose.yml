version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: poker_calculator_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - poker_network

  backend:
    image: ${GHCR_BACKEND_IMAGE:-ghcr.io/mageri9/poker_calculator_backend}:latest
    container_name: poker_calculator_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/data/poker.db
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    networks:
      - poker_network

  frontend:
    image: ${GHCR_FRONTEND_IMAGE:-ghcr.io/mageri9/poker_calculator_frontend}:latest
    container_name: poker_calculator_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - poker_network

volumes:
  redis_data:

networks:
  nexus_shared:
    external: true
  poker_network:
    driver: bridge