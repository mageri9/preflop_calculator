name: Build and Deploy Poker Calculator to VPS

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  MAINTENANCE_TTL_SECONDS: "180"

jobs:
  # 1. ЗАПУСК ТЕСТОВ ПЕРЕД СБОРКОЙ
  test:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456:fake_token_for_ci_tests"
      ENVIRONMENT: "development"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/

  # 2. СБОРКА И ОТПРАВКА ОБРАЗОВ В GHCR
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_BACKEND_IMAGE=ghcr.io/${OWNER_LOWER}/poker_calculator_backend" >> $GITHUB_ENV
          echo "GHCR_FRONTEND_IMAGE=ghcr.io/${OWNER_LOWER}/poker_calculator_frontend" >> $GITHUB_ENV

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.GHCR_BACKEND_IMAGE }}:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.GHCR_FRONTEND_IMAGE }}:latest

  # 3. БЕЗОПАСНЫЙ ДЕПЛОЙ НА VPS С ПОДАВЛЕНИЕМ ШУМА В NEXUS SRE
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, test]
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Execute remote SSH commands to deploy App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          envs: MAINTENANCE_TTL_SECONDS
          script: |
            set -e
            mkdir -p ~/apps/poker_calculator
            cd ~/apps/poker_calculator

            OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            GHCR_BACKEND_IMAGE="ghcr.io/${OWNER_LOWER}/poker_calculator_backend"
            GHCR_FRONTEND_IMAGE="ghcr.io/${OWNER_LOWER}/poker_calculator_frontend"

            # Записываем имена образов в .env
            touch .env
            grep -q '^GHCR_BACKEND_IMAGE=' .env \
              && sed -i "s|^GHCR_BACKEND_IMAGE=.*|GHCR_BACKEND_IMAGE=${GHCR_BACKEND_IMAGE}|" .env \
              || echo "GHCR_BACKEND_IMAGE=${GHCR_BACKEND_IMAGE}" >> .env

            grep -q '^GHCR_FRONTEND_IMAGE=' .env \
              && sed -i "s|^GHCR_FRONTEND_IMAGE=.*|GHCR_FRONTEND_IMAGE=${GHCR_FRONTEND_IMAGE}|" .env \
              || echo "GHCR_FRONTEND_IMAGE=${GHCR_FRONTEND_IMAGE}" >> .env

            # Устанавливаем флаг обслуживания в Nexus Redis (если задействована экосистема Nexus)
            docker exec nexus-redis redis-cli SET nexus:maintenance:poker_calculator 1 EX "${MAINTENANCE_TTL_SECONDS}" \
              || echo "::warning::Could not set maintenance flag in Nexus Redis, continuing..."

            # Скачиваем свежие образы с GHCR
            docker compose pull

            # Пересоздаем и поднимаем контейнеры
            docker compose up -d --force-recreate